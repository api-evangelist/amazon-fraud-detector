naftiko: 1.0.0-alpha2
info:
  label: Amazon Fraud Detector API — Models
  description: 'Amazon Fraud Detector API — Models. 2 operations. Lead operation: Put Model. Self-contained Naftiko capability
    covering one Amazon Fraud Detector business surface.'
  tags:
  - Amazon Fraud Detector
  - Models
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_FRAUD_DETECTOR_API_KEY: AMAZON_FRAUD_DETECTOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-fraud-detector-models
    baseUri: https://frauddetector.{region}.amazonaws.com
    description: Amazon Fraud Detector API — Models business capability. Self-contained, no shared references.
    resources:
    - name: models
      path: /models
      operations:
      - name: putmodel
        method: PUT
        description: Put Model
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: getmodels
        method: POST
        description: Get Models
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_FRAUD_DETECTOR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-fraud-detector-models-rest
    port: 8080
    description: REST adapter for Amazon Fraud Detector API — Models. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/models
      name: models
      description: REST surface for models.
      operations:
      - method: PUT
        name: putmodel
        description: Put Model
        call: amazon-fraud-detector-models.putmodel
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: getmodels
        description: Get Models
        call: amazon-fraud-detector-models.getmodels
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-fraud-detector-models-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Fraud Detector API — Models. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: put-model
      description: Put Model
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: amazon-fraud-detector-models.putmodel
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-models
      description: Get Models
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: amazon-fraud-detector-models.getmodels
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
