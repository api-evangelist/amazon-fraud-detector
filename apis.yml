aid: amazon-fraud-detector
name: Amazon Fraud Detector
description: >-
  Amazon Fraud Detector is a fully managed service that uses machine learning to identify potentially fraudulent
  activities and accurately distinguish between legitimate and high-risk transactions. It uses your data and the same
  technology that Amazon uses to protect its own business from fraud.
